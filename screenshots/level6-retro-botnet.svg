<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_botnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F081C"/>
      <stop offset="50%" stop-color="#190C28"/>
      <stop offset="100%" stop-color="#080410"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38B2AC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#805AD5" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Arcade Background -->
  <rect width="1200" height="675" fill="url(#bg_botnet)"/>

  <!-- Top Cabinet Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#140A22" stroke="#B83280" stroke-width="2"/>
  <text x="35" y="38" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#F687B3">BOT INVADERS 1985 // MATRIZ DE RED</text>
  <text x="440" y="38" font-family="'Courier New', monospace" font-size="14" fill="#EDEBFA">NIVEL 6: DOGPILING Y REDES DE BOTS COORDINADAS</text>
  <text x="960" y="38" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#F687B3">AMPLIFICACIÓN: x12.4</text>

  <!-- CRT Screen Bezel -->
  <rect x="60" y="80" width="1080" height="565" rx="16" fill="#07030C" stroke="#B83280" stroke-width="4"/>
  <rect x="68" y="88" width="1064" height="549" rx="12" fill="none" stroke="#702459" stroke-width="2"/>

  <!-- CRT Scanlines -->
  <line x1="80" y1="140" x2="1120" y2="140" stroke="#B83280" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="80" y1="220" x2="1120" y2="220" stroke="#B83280" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="80" y1="300" x2="1120" y2="300" stroke="#B83280" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="80" y1="380" x2="1120" y2="380" stroke="#B83280" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="80" y1="460" x2="1120" y2="460" stroke="#B83280" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Mission Alert -->
  <rect x="100" y="105" width="1000" height="55" rx="4" fill="#200B22" stroke="#ED64A6" stroke-width="1.5"/>
  <text x="120" y="132" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#ED64A6">🚨 ALERTA AMI // ATAQUE EN JAURÍA (DOGPILING) FINANCIADO CON 200 CUENTAS FALSAS</text>
  <text x="120" y="150" font-family="'Courier New', monospace" font-size="11" fill="#EDEBFA">Desactiva los bots amplificadores sin alimentar al troll. Emite rayos periciales de contranarrativa comunitaria.</text>

  <!-- Swarm of Bots (Space Invaders Formation) -->
  <!-- Row 1 -->
  <g transform="translate(180, 185)">
    <rect width="60" height="40" rx="3" fill="#3D1225" stroke="#E53E3E" stroke-width="2"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="16" fill="#FEB2B2" text-anchor="middle">👾</text>
  </g>
  <g transform="translate(300, 185)">
    <rect width="60" height="40" rx="3" fill="#3D1225" stroke="#E53E3E" stroke-width="2"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="16" fill="#FEB2B2" text-anchor="middle">👾</text>
  </g>
  <g transform="translate(420, 185)">
    <rect width="60" height="40" rx="3" fill="#201530" stroke="#805AD5" stroke-width="1.5"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="16" fill="#D6BCFA" text-anchor="middle">🤖</text>
  </g>
  <g transform="translate(540, 185)">
    <rect width="60" height="40" rx="3" fill="#201530" stroke="#805AD5" stroke-width="1.5"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="16" fill="#D6BCFA" text-anchor="middle">🤖</text>
  </g>
  <g transform="translate(660, 185)">
    <rect width="60" height="40" rx="3" fill="#3D1225" stroke="#E53E3E" stroke-width="2"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="16" fill="#FEB2B2" text-anchor="middle">👾</text>
  </g>
  <g transform="translate(780, 185)">
    <rect width="60" height="40" rx="3" fill="#3D1225" stroke="#E53E3E" stroke-width="2"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="16" fill="#FEB2B2" text-anchor="middle">👾</text>
  </g>
  <g transform="translate(900, 185)">
    <rect width="60" height="40" rx="3" fill="#201530" stroke="#805AD5" stroke-width="1.5"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="16" fill="#D6BCFA" text-anchor="middle">🤖</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(240, 245)">
    <rect width="60" height="40" rx="3" fill="#201530" stroke="#805AD5" stroke-width="1.5"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="16" fill="#D6BCFA" text-anchor="middle">🤖</text>
  </g>
  <g transform="translate(360, 245)">
    <rect width="60" height="40" rx="3" fill="#14261C" stroke="#38A169" stroke-width="1.5"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#68D391" text-anchor="middle">OFF</text>
  </g>
  <g transform="translate(480, 245)">
    <rect width="60" height="40" rx="3" fill="#3D1225" stroke="#E53E3E" stroke-width="2"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="16" fill="#FEB2B2" text-anchor="middle">👾</text>
  </g>
  <g transform="translate(600, 245)">
    <!-- Hit animation -->
    <rect width="60" height="40" rx="3" fill="#E2E8F0" stroke="#FAF089" stroke-width="3"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#744210" text-anchor="middle">HIT!</text>
  </g>
  <g transform="translate(720, 245)">
    <rect width="60" height="40" rx="3" fill="#201530" stroke="#805AD5" stroke-width="1.5"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="16" fill="#D6BCFA" text-anchor="middle">🤖</text>
  </g>
  <g transform="translate(840, 245)">
    <rect width="60" height="40" rx="3" fill="#3D1225" stroke="#E53E3E" stroke-width="2"/>
    <text x="30" y="25" font-family="'Courier New', monospace" font-size="16" fill="#FEB2B2" text-anchor="middle">👾</text>
  </g>

  <!-- Player Fact-Check Laser Beam -->
  <rect x="620" y="285" width="20" height="245" fill="url(#beamGrad)"/>

  <!-- Player Solidarity Cannon -->
  <polygon points="630,510 600,550 660,550" fill="#38B2AC" stroke="#4FD1C5" stroke-width="2"/>
  <rect x="585" y="550" width="90" height="15" rx="3" fill="#234E52" stroke="#4FD1C5" stroke-width="1.5"/>
  <text x="630" y="562" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#EDEBFA" text-anchor="middle">CONTRANARRATIVA</text>

  <!-- Bottom HUD in Arcade Screen -->
  <rect x="100" y="580" width="1000" height="45" rx="4" fill="#140A22" stroke="#702459" stroke-width="1.5"/>
  <text x="125" y="608" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ED64A6">ENJAMBRE DE BOTS: 10/18 ELIMINADOS</text>
  <text x="440" y="608" font-family="'Courier New', monospace" font-size="12" fill="#38B2AC">ESCUDO COMUNITARIO: ACTIVO</text>
  <text x="700" y="608" font-family="'Courier New', monospace" font-size="12" fill="#F2B544">PRUEBA #6: SCRIPT DE BOTS AISLADO</text>
  <text x="980" y="608" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ED64A6">+250 PTS</text>
</svg>
