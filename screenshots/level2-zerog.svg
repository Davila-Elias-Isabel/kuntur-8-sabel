<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B1A"/>
      <stop offset="50%" stop-color="#101026"/>
      <stop offset="100%" stop-color="#070712"/>
    </linearGradient>
    <linearGradient id="thruster" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FD1C5"/>
      <stop offset="100%" stop-color="#5E4FA2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Space and Grid -->
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#5E4FA2" stroke-opacity="0.2" stroke-dasharray="4,8"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#5E4FA2" stroke-opacity="0.2" stroke-dasharray="4,8"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#5E4FA2" stroke-opacity="0.2" stroke-dasharray="4,8"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#5E4FA2" stroke-opacity="0.2" stroke-dasharray="4,8"/>

  <!-- Top HUD Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#0E0E22" stroke="#5E4FA2" stroke-width="1"/>
  <text x="30" y="38" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#4FD1C5">KUNTUR // ALEX</text>
  <text x="210" y="38" font-family="'JetBrains Mono', monospace" font-size="14" fill="#A6A2C5">NIVEL 2: HANGAR EN GRAVEDAD CERO</text>
  <text x="750" y="38" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8F8CA8">VIDAS: ❤ ❤ ❤</text>
  <rect x="890" y="24" width="120" height="14" fill="#1B1B36" rx="2" stroke="#4FD1C5" stroke-width="1"/>
  <rect x="892" y="26" width="95" height="10" fill="#4FD1C5" rx="1"/>
  <text x="1025" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#4FD1C5">85 pts</text>

  <!-- Main Game Frame -->
  <rect x="60" y="85" width="1080" height="545" rx="6" fill="#12122A" stroke="#5E4FA2" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="80" y="105" width="140" height="26" rx="3" fill="#F2B544" fill-opacity="0.15"/>
  <text x="95" y="123" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#F2B544">NIVEL 2 DE 5</text>
  <text x="240" y="123" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold" fill="#EDEBFA">HANGAR DESPRESURIZADO // INTERCEPTACIÓN DE MICRODRON ESPÍA</text>

  <!-- Simulation Zone (Canvas Area) -->
  <rect x="80" y="145" width="760" height="380" rx="4" fill="#0B0B18" stroke="#3D3D6B" stroke-width="1.5"/>
  
  <!-- Stars in Hangar -->
  <circle cx="150" cy="200" r="1.5" fill="#FFF" opacity="0.6"/>
  <circle cx="320" cy="180" r="1" fill="#FFF" opacity="0.4"/>
  <circle cx="560" cy="240" r="2" fill="#4FD1C5" opacity="0.8"/>
  <circle cx="410" cy="380" r="1.5" fill="#FFF" opacity="0.5"/>
  <circle cx="680" cy="420" r="1" fill="#FFF" opacity="0.4"/>
  <circle cx="250" cy="460" r="2" fill="#F2B544" opacity="0.7"/>

  <!-- Jetpack Player (Alex) -->
  <g transform="translate(220, 310)">
    <!-- Propulsion flare -->
    <path d="M-30,5 L-5,0 L-3,10 Z" fill="url(#thruster)" filter="url(#glow2)"/>
    <circle cx="0" cy="5" r="16" fill="#4FD1C5" stroke="#EDEBFA" stroke-width="2"/>
    <circle cx="2" cy="4" r="7" fill="#0B0B1A"/>
    <rect x="-12" y="-12" width="6" height="24" rx="2" fill="#5E4FA2"/>
    <text x="-40" y="-18" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4FD1C5" font-weight="bold">CADETE ALEX</text>
  </g>

  <!-- Tractor Beam Wave -->
  <line x1="236" y1="315" x2="620" y2="245" stroke="#4FD1C5" stroke-width="2" stroke-dasharray="6,4" filter="url(#glow2)"/>

  <!-- Spy Microdrone Target -->
  <g transform="translate(620, 245)">
    <circle cx="0" cy="0" r="14" fill="#D7263D" stroke="#FFA6B0" stroke-width="2" filter="url(#glow2)"/>
    <circle cx="0" cy="0" r="5" fill="#FFF"/>
    <!-- Rotor arms -->
    <line x1="-18" y1="-18" x2="18" y2="18" stroke="#8F8CA8" stroke-width="2"/>
    <line x1="-18" y1="18" x2="18" y2="-18" stroke="#8F8CA8" stroke-width="2"/>
    <text x="-35" y="-24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D7263D" font-weight="bold">DRON CLANDESTINO</text>
  </g>

  <!-- HUD Compass / Distance Tracker -->
  <rect x="100" y="165" width="220" height="50" rx="3" fill="#12122A" fill-opacity="0.8" stroke="#4FD1C5" stroke-width="1"/>
  <text x="115" y="185" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A6A2C5">DISTANCIA AL OBJETIVO:</text>
  <text x="115" y="203" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#4FD1C5">14.2 METROS [BLOQUEADO]</text>

  <!-- Right Info Panel: MicroSD Evidence -->
  <rect x="860" y="145" width="260" height="380" rx="4" fill="#161632" stroke="#5E4FA2" stroke-width="1"/>
  <rect x="875" y="160" width="230" height="28" rx="2" fill="#F2B544" fill-opacity="0.15"/>
  <text x="888" y="179" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#F2B544">PRUEBA CLAVE #2</text>

  <text x="875" y="220" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#EDEBFA">TARJETA MICROSD</text>
  <text x="875" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A6A2C5">Almacena la grabación pura del hangar sin manipular. Demuestra que Diego montó una cámara clandestina para fabricar el holofake.</text>

  <rect x="875" y="290" width="230" height="90" rx="3" fill="#0B0B1A" stroke="#3D3D6B" stroke-width="1"/>
  <text x="890" y="315" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4FD1C5">> FORMATO: RAW_VFX_1080P</text>
  <text x="890" y="335" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4FD1C5">> HASH MD5: 9a8f2c...41e</text>
  <text x="890" y="355" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4FD1C5">> ESTADO: RECUPERADO 100%</text>

  <!-- Bottom Action Bar -->
  <rect x="80" y="545" width="1040" height="65" rx="3" fill="#0B0B1A" stroke="#5E4FA2" stroke-width="1"/>
  <text x="100" y="582" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#EDEBFA">
    <tspan fill="#4FD1C5" font-weight="bold">CONSEJO TÉCNICO:</tspan> Usa el propulsor con inercia para cerrar la distancia sin chocar contra las compuertas presurizadas.
  </text>
</svg>
