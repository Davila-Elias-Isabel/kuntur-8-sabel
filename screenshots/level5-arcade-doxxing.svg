<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_retro5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080812"/>
      <stop offset="50%" stop-color="#100E26"/>
      <stop offset="100%" stop-color="#05050C"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00FFAA" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Arcade Background -->
  <rect width="1200" height="675" fill="url(#bg_retro5)"/>

  <!-- Top Cabinet Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#0E0D22" stroke="#4FD1C5" stroke-width="2"/>
  <text x="35" y="38" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#4FD1C5">ARCADE 1984 // CYBER-SHIELD</text>
  <text x="440" y="38" font-family="'Courier New', monospace" font-size="14" fill="#EDEBFA">NIVEL 5: DOXXING Y SUPLANTACIÓN DE IDENTIDAD</text>
  <text x="960" y="38" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00FFAA">HI-SCORE: 24,800</text>

  <!-- CRT Screen Bezel -->
  <rect x="60" y="80" width="1080" height="565" rx="16" fill="#06060E" stroke="#4FD1C5" stroke-width="4"/>
  <rect x="68" y="88" width="1064" height="549" rx="12" fill="none" stroke="#234E52" stroke-width="2"/>

  <!-- Screen Grid Scanlines simulation -->
  <line x1="80" y1="130" x2="1120" y2="130" stroke="#4FD1C5" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="80" y1="200" x2="1120" y2="200" stroke="#4FD1C5" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="80" y1="270" x2="1120" y2="270" stroke="#4FD1C5" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="80" y1="340" x2="1120" y2="340" stroke="#4FD1C5" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="80" y1="410" x2="1120" y2="410" stroke="#4FD1C5" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="80" y1="480" x2="1120" y2="480" stroke="#4FD1C5" stroke-opacity="0.1" stroke-width="1"/>

  <!-- In-Game Mission Alert Banner -->
  <rect x="100" y="105" width="1000" height="65" rx="4" fill="#141E28" stroke="#00FFAA" stroke-width="1.5"/>
  <text x="120" y="132" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00FFAA">⚠ ALERTA FORENSE // TERMINAL DE DIEGO DETECTADA FILTRANDO DATOS PRIVADOS</text>
  <text x="120" y="154" font-family="'Courier New', monospace" font-size="12" fill="#EDEBFA">Intercepta paquetes de doxxing y perfiles impostores con el escudo láser 2FA antes de que alcancen la red abierta.</text>

  <!-- Falling Doxxing Packets -->
  <!-- Packet 1: Neutralized -->
  <rect x="250" y="210" width="180" height="38" rx="4" fill="#00FFAA" fill-opacity="0.15" stroke="#00FFAA" stroke-width="1.5"/>
  <text x="265" y="234" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00FFAA">✓ WHATSAPP_LEAK [BLOQ]</text>

  <!-- Packet 2: Impersonation Profile (Active) -->
  <rect x="520" y="260" width="220" height="42" rx="4" fill="#3D1220" stroke="#FF477E" stroke-width="2"/>
  <text x="535" y="286" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#FF477E">⚡ PERFIL_FALSO_VALE.EXE</text>

  <!-- Packet 3: Private Location (Falling) -->
  <rect x="820" y="190" width="200" height="38" rx="4" fill="#2A1B0E" stroke="#F2B544" stroke-width="1.5"/>
  <text x="835" y="214" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F2B544">📍 CAMAROTE_UBICACION.LOG</text>

  <!-- Packet 4: Password Leak -->
  <rect x="360" y="330" width="170" height="36" rx="4" fill="#2A1B0E" stroke="#F2B544" stroke-width="1.5"/>
  <text x="375" y="353" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#F2B544">🔑 PASSWORDS_LEAK.HEX</text>

  <!-- Vertical Laser Beam Fired from Paddle -->
  <rect x="620" y="295" width="20" height="235" fill="url(#laserGrad)"/>

  <!-- Player 2FA Shield Paddle -->
  <rect x="570" y="530" width="120" height="22" rx="4" fill="#4FD1C5" stroke="#00FFAA" stroke-width="2"/>
  <rect x="618" y="520" width="24" height="10" rx="2" fill="#00FFAA"/>
  <text x="630" y="545" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#06060E" text-anchor="middle">2FA DEFENSE</text>

  <!-- Bottom HUD Status inside screen -->
  <rect x="100" y="575" width="1000" height="50" rx="4" fill="#0B131F" stroke="#234E52" stroke-width="1.5"/>
  <text x="125" y="605" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#4FD1C5">INTEGRIDAD DE RED: 92%</text>
  <text x="350" y="605" font-family="'Courier New', monospace" font-size="12" fill="#EDEBFA">PAQUETES NEUTRALIZADOS: 5/6</text>
  <text x="660" y="605" font-family="'Courier New', monospace" font-size="12" fill="#F2B544">PRUEBA #5: LOG DE DOXXING OBTENIDA</text>
  <text x="960" y="605" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00FFAA">SCORE: 1,250 PTS</text>
</svg>
