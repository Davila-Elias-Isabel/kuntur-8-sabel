<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="50%" stop-color="#0E0E24"/>
      <stop offset="100%" stop-color="#05050D"/>
    </linearGradient>
    <radialGradient id="empPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#5E4FA2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0B0B1A" stop-opacity="0"/>
    </radialGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Cosmic Void -->
  <rect width="1200" height="675" fill="url(#bg4)"/>

  <!-- Starfield and Nebula Streaks -->
  <circle cx="100" cy="180" r="1.5" fill="#FFF" opacity="0.7"/>
  <circle cx="340" cy="120" r="1" fill="#4FD1C5" opacity="0.6"/>
  <circle cx="580" cy="210" r="2" fill="#FFF" opacity="0.8"/>
  <circle cx="820" cy="140" r="1" fill="#F2B544" opacity="0.7"/>
  <circle cx="950" cy="300" r="1.5" fill="#FFF" opacity="0.5"/>
  <circle cx="210" cy="480" r="1.5" fill="#FFF" opacity="0.6"/>
  <circle cx="490" cy="540" r="2" fill="#4FD1C5" opacity="0.5"/>
  <circle cx="730" cy="460" r="1" fill="#FFF" opacity="0.4"/>

  <!-- Top HUD Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#0E0E22" stroke="#5E4FA2" stroke-width="1"/>
  <text x="30" y="38" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#4FD1C5">KUNTUR // ALEX</text>
  <text x="210" y="38" font-family="'JetBrains Mono', monospace" font-size="14" fill="#A6A2C5">NIVEL 4: CARRERA EN NAVE &amp; CORTE DE DIFUSIÓN</text>
  <text x="750" y="38" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8F8CA8">VIDAS: ❤ ❤ ❤</text>
  <rect x="890" y="24" width="120" height="14" fill="#1B1B36" rx="2" stroke="#4FD1C5" stroke-width="1"/>
  <rect x="892" y="26" width="105" height="10" fill="#4FD1C5" rx="1"/>
  <text x="1025" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#4FD1C5">95 pts</text>

  <!-- Main Game Frame -->
  <rect x="60" y="85" width="1080" height="545" rx="6" fill="#12122A" stroke="#5E4FA2" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="80" y="105" width="140" height="26" rx="3" fill="#D7263D" fill-opacity="0.15"/>
  <text x="95" y="123" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#D7263D">NIVEL 4 DE 5</text>
  <text x="240" y="123" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold" fill="#EDEBFA">CAMPO DE ASTEROIDES // BLOQUEO DE ANTENAS REPETIDORAS</text>

  <!-- Flight Simulation Area -->
  <rect x="80" y="145" width="760" height="380" rx="4" fill="#070714" stroke="#3D3D6B" stroke-width="1.5"/>

  <!-- Interceptor Ship (KUNTUR-1) -->
  <g transform="translate(180, 320)">
    <!-- Engine plasma tail -->
    <polygon points="-40,0 -80,-8 -60,0 -80,8" fill="#4FD1C5" opacity="0.8" filter="url(#laserGlow)"/>
    <!-- Ship fuselage -->
    <polygon points="50,0 -20,-18 -10,0 -20,18" fill="#1E1E42" stroke="#4FD1C5" stroke-width="2"/>
    <circle cx="10" cy="0" r="5" fill="#4FD1C5"/>
    <line x1="15" y1="0" x2="120" y2="0" stroke="#4FD1C5" stroke-width="2" filter="url(#laserGlow)"/>
    <text x="-30" y="-25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4FD1C5" font-weight="bold">KUNTUR-1</text>
  </g>

  <!-- Asteroid Obstacles -->
  <polygon points="420,210 450,225 435,260 395,250 405,220" fill="#2D2D4A" stroke="#5E4FA2" stroke-width="1.5"/>
  <polygon points="560,400 600,410 590,445 540,430 550,405" fill="#282842" stroke="#5E4FA2" stroke-width="1.5"/>

  <!-- Relay Station Antenna 1 (Destroyed) -->
  <g transform="translate(480, 190)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#8F8CA8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#8F8CA8" stroke-width="2"/>
    <text x="-25" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8F8CA8">[INACTIVA]</text>
  </g>

  <!-- Relay Station Antenna 2 (Targeted) -->
  <g transform="translate(680, 310)">
    <!-- EMP Blast Radius -->
    <circle cx="0" cy="0" r="45" fill="url(#empPulse)"/>
    <circle cx="0" cy="0" r="22" fill="#161632" stroke="#D7263D" stroke-width="2" filter="url(#laserGlow)"/>
    <circle cx="0" cy="0" r="8" fill="#F2B544"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#D7263D" stroke-width="2"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#D7263D" stroke-width="2"/>
    <text x="-40" y="-32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F2B544" font-weight="bold">REPETIDORA #2</text>
    <text x="-30" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D7263D">DIFUNDIENDO...</text>
  </g>

  <!-- Right Info Panel: IP Traza Evidence -->
  <rect x="860" y="145" width="260" height="380" rx="4" fill="#161632" stroke="#5E4FA2" stroke-width="1"/>
  <rect x="875" y="160" width="230" height="28" rx="2" fill="#4FD1C5" fill-opacity="0.15"/>
  <text x="888" y="179" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#4FD1C5">PRUEBA CLAVE #4</text>

  <text x="875" y="220" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#EDEBFA">TRAZA DE RED &amp; IP</text>
  <text x="875" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#A6A2C5">Al cortar la señal en el origen, los paquetes de red revelan la MAC y la dirección IP privada de la terminal de Diego conectada al transmisor.</text>

  <rect x="875" y="300" width="230" height="90" rx="3" fill="#0B0B1A" stroke="#3D3D6B" stroke-width="1"/>
  <text x="890" y="325" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4FD1C5">> ORIGEN: 192.168.4.12</text>
  <text x="890" y="345" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F2B544">> HOST: TERM_CADETE_DIEGO</text>
  <text x="890" y="365" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4FD1C5">> TRAZA: CAPTURADA 100%</text>

  <!-- Bottom Action Bar -->
  <rect x="80" y="545" width="1040" height="65" rx="3" fill="#0B0B1A" stroke="#5E4FA2" stroke-width="1"/>
  <text x="100" y="582" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#EDEBFA">
    <tspan fill="#4FD1C5" font-weight="bold">OBJETIVO TÁCTICO:</tspan> Dispara pulsos electromagnéticos (EMP) para desactivar las 3 antenas repetidoras antes de que el archivo termine de propagarse a los cuadrantes civiles.
  </text>
</svg>
