<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140810"/>
      <stop offset="50%" stop-color="#1A122B"/>
      <stop offset="100%" stop-color="#0E0A1E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg5)"/>

  <!-- Top HUD -->
  <rect x="0" y="0" width="1200" height="60" fill="#0E0E22" stroke="#5E4FA2" stroke-width="1"/>
  <text x="30" y="38" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#D7263D">KUNTUR // ALEX</text>
  <text x="210" y="38" font-family="'JetBrains Mono', monospace" font-size="14" fill="#EDEBFA">NIVEL 5: SALA DEL CONSEJO // EL DUELO DE PRUEBAS</text>
  <text x="800" y="38" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8F8CA8">VIDAS: ❤ ❤ ❤</text>
  <text x="1030" y="38" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#4FD1C5">95 pts</text>

  <!-- Council Chamber Stage -->
  <rect x="60" y="85" width="1080" height="550" rx="6" fill="#12122A" stroke="#D7263D" stroke-width="2"/>

  <!-- Dramatic Banner: OBJECTION / ¡FALSO! -->
  <rect x="360" y="110" width="480" height="60" rx="4" fill="#D7263D" stroke="#FFFFFF" stroke-width="2"/>
  <text x="600" y="152" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">¡¡¡ FALSO !!!</text>

  <!-- Judge / Commander Rosa -->
  <rect x="100" y="185" width="480" height="135" rx="4" fill="#181836" stroke="#4FD1C5" stroke-width="1.5"/>
  <text x="120" y="212" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#4FD1C5">COMANDANTE ROSA // PRESIDENTA DEL CONSEJO:</text>
  <text x="120" y="238" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#EDEBFA">«El Consejo exige evidencias científicas irrefutables. Ale, el cadete</text>
  <text x="120" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#EDEBFA">Diego afirma que Vale estuvo ausente de su guardia y que el video</text>
  <text x="120" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#EDEBFA">demuestra negligencia. Presenta la prueba pericial que lo desmienta.»</text>

  <!-- Accuser Diego -->
  <rect x="620" y="185" width="480" height="135" rx="4" fill="#24101A" stroke="#F2B544" stroke-width="1.5"/>
  <text x="640" y="212" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#F2B544">DIEGO // CADETE ACUSADOR:</text>
  <text x="640" y="238" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#EDEBFA">«¡No tiene defensa! Todos vieron la transmisión en los paneles del</text>
  <text x="640" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#EDEBFA">hangar. Vale fue ascendida sin mérito y abandonó sus funciones.»</text>
  <text x="640" y="285" font-family="'JetBrains Mono', monospace" font-size="10" font-style="italic" fill="#8F8CA8">[Intento 1 de 4 // Contradice con la prueba recolectada]</text>

  <!-- Clues Carousel: The 4 Gathered Evidence Items -->
  <text x="100" y="350" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#4FD1C5">EXPEDIENTE PERICIAL // SELECCIONA LA PRUEBA EXACTA:</text>

  <!-- Clue 1: Oscilloscope -->
  <rect x="100" y="370" width="240" height="145" rx="4" fill="#0C1F22" stroke="#4FD1C5" stroke-width="2"/>
  <text x="115" y="395" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#4FD1C5">PRUEBA #1: OSCILOSCOPIO</text>
  <text x="115" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#EDEBFA">Coartada Oficial 14:00 hrs</text>
  <text x="115" y="435" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#A6A2C5">Bitácora técnica con onda 4.0 Hz que certifica que Vale estuvo calibrando válvulas en el taller.</text>
  <rect x="115" y="480" width="210" height="22" rx="2" fill="#4FD1C5"/>
  <text x="220" y="495" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#0B0B1A" text-anchor="middle">✓ PRESENTAR PRUEBA</text>

  <!-- Clue 2: Microdrone SD -->
  <rect x="360" y="370" width="230" height="145" rx="4" fill="#141430" stroke="#5E4FA2" stroke-width="1"/>
  <text x="375" y="395" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#8F8CA8">PRUEBA #2: MICRODRON</text>
  <text x="375" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#EDEBFA">Tarjeta SD y Metadatos</text>
  <text x="375" y="435" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8F8CA8">Grabaciones no autorizadas en el hangar que prueban hostigamiento premeditado.</text>

  <!-- Clue 3: Forensic Report -->
  <rect x="610" y="370" width="230" height="145" rx="4" fill="#141430" stroke="#5E4FA2" stroke-width="1"/>
  <text x="625" y="395" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#8F8CA8">PRUEBA #3: REPORTE IA</text>
  <text x="625" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#EDEBFA">4 Anomalías del Holofake</text>
  <text x="625" y="435" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8F8CA8">Peritaje de parpadeo, sombras invertidas y watermark de software generativo.</text>

  <!-- Clue 4: IP & Hash -->
  <rect x="860" y="370" width="240" height="145" rx="4" fill="#141430" stroke="#5E4FA2" stroke-width="1"/>
  <text x="875" y="395" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#8F8CA8">PRUEBA #4: TRAZA DE IP</text>
  <text x="875" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#EDEBFA">Firma de Terminal Diego</text>
  <text x="875" y="435" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#8F8CA8">Paquete de red interceptado de las antenas que vincula el casillero de Diego con «El Eco».</text>

  <!-- Verdict Bottom Text -->
  <rect x="100" y="535" width="1000" height="75" rx="4" fill="#0C2522" stroke="#4FD1C5" stroke-width="1.5"/>
  <text x="120" y="562" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#4FD1C5">VEREDICTO INMEDIATO // VALE RATIFICADA CON HONORES</text>
  <text x="120" y="585" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#EDEBFA">«El informe del osciloscopio prueba de manera contundente la falsedad de la acusación. La coartada es perfecta.»</text>
</svg>
